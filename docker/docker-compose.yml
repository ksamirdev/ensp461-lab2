name: lab2
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ensp461-lab2:2.0.0
    ports: ["5000:5000"]
    environment:
      REDIS_HOST: redis
      APP_ENV: compose
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  redis-data:
